<html lang="id">

<link rel="apple-touch-icon" href="icon-180.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Same look as Iron & Rice: phone-width column, dark scoreboard, weight-plate colours. Read-only page for family. */
:root{
  --bg:#ECEEEA;--surface:#FAFBF8;--sunk:#E0E3DE;--ink:#141619;--muted:#596066;--line:#CDD2CB;
  --protein:#C42F28;--ok:#2A8650;--carbs:#1D55BE;--on-ink:#FAFBF8;
  --board:#17191C;--board-2:#24272B;--board-ink:#F2F3EF;--board-muted:#9EA5AB;--bp:#EF5A4F;--bo:#47BF7B;
  --char:#E0463C;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101113;--surface:#191B1E;--sunk:#23262A;--ink:#ECEDE9;--muted:#9AA1A7;--line:#2E3236;
  --protein:#EF5A4F;--ok:#47BF7B;--carbs:#5C8DF0;--on-ink:#111214;--board:#1F2226;--board-2:#2B2F34;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:1.05;text-wrap:balance}
h1{font-size:34px}h2{font-size:22px}h3{font-size:16px;letter-spacing:.03em}
p{margin:0}
.eyebrow{font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
small{font-size:13px;color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--carbs);outline-offset:2px;border-radius:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h .side{font:500 12px var(--mono);color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.stale i{background:var(--muted)}
.daystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--line))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.coach{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.char{background:var(--sunk);border-radius:20px;padding:6px;display:grid;place-items:center;width:104px;height:104px;overflow:hidden}
.char > svg,.char > img{width:100%;height:100%;object-fit:contain;display:block;transform-origin:50% 100%}
.char img.pix{image-rendering:pixelated}
.char.s-sad > img{filter:saturate(.45) brightness(.92)}
.s-idle > *{animation:bob 2.6s ease-in-out infinite}.s-cheer > *{animation:hop .6s ease-in-out infinite}.s-flex > *{animation:flexy 1.1s ease-in-out infinite}
.s-wave > *{animation:wave 1.1s ease-in-out infinite}.s-sleep > *{animation:breathe 3.2s ease-in-out infinite}.s-sad > *{animation:slump 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3%)}}@keyframes hop{40%{transform:translateY(-11%) scale(.96,1.04)}80%{transform:scale(1.05,.95)}}
@keyframes flexy{50%{transform:scale(1.07)}}@keyframes wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes breathe{50%{transform:scale(1.03,.97)}}@keyframes slump{0%,100%{transform:translateY(2%) scale(1,.97)}50%{transform:translateY(4%) scale(1.02,.95)}}
.aura{animation:aura 2.4s ease-in-out infinite}@keyframes aura{50%{fill-opacity:.25}}
.bubble{position:relative;background:var(--surface);border:2px solid var(--char);border-radius:16px;padding:10px 12px;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;border-style:solid;border-width:8px 10px 8px 0;border-color:transparent var(--char) transparent transparent}
.bubble b{font:800 15px var(--display);text-transform:uppercase;letter-spacing:.06em;display:block}
.bubble p{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.board{background:var(--board);color:var(--board-ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.board .eyebrow{color:var(--board-muted)}
.board-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum .n{font:900 clamp(64px,19vw,88px)/.85 var(--display);font-variant-numeric:tabular-nums}
.bignum .u{font:800 20px var(--display);text-transform:uppercase;color:var(--board-muted)}
.bignum.over .n{color:var(--bp)}
.stack{height:14px;border-radius:99px;background:var(--board-2);overflow:hidden}
.stack i{display:block;height:100%;border-radius:inherit}
.legend{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--board-muted);margin-top:-6px}
.mrow{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px}
.mrow .ml{font:800 15px var(--display);text-transform:uppercase;letter-spacing:.05em}
.mbar{height:8px;border-radius:99px;background:var(--board-2);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--bp)}
.mrow .mv{font:500 13px var(--mono);color:var(--board-muted)}
.mrow .mv b{color:var(--board-ink);font-weight:500}
.slot{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px}
.slot span{font:500 12px var(--mono);color:var(--muted)}
.entries{list-style:none;margin:0;padding:0}
.entries li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.entries li:last-child{border-bottom:0}
.entries .en{display:flex;flex-direction:column;min-width:0;font-weight:600}
.entries .ek{font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.ntag{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--carbs) 16%,var(--surface));color:var(--carbs)}
.empty{padding:14px;border-radius:12px;background:var(--sunk);color:var(--muted);font-size:15px}
.night{border-color:var(--char)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:12px;padding:10px}
.stat b{display:block;font:800 24px var(--display);font-variant-numeric:tabular-nums}
.stat span{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.wbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wbig b{font:900 52px/.9 var(--display);font-variant-numeric:tabular-nums}
.wbig span{font:800 18px var(--display);text-transform:uppercase;color:var(--muted)}
.wbar{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.wbar i{display:block;height:100%;background:var(--ok);border-radius:inherit}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td{font-weight:600}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main id="app"><section class="card"><p class="note">Memuat…</p></section></main>
<script>
'use strict';
/* Read-only family page. data.json is encrypted (AES-GCM); the key is only in this page's link, after the #. */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const g1 = n => { const v = Math.round(n * 10) / 10; return (Number.isInteger(v) ? String(v) : v.toFixed(1)).replace('.', ','); };
const fmt = n => Math.round(n).toLocaleString('id-ID');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const SLOTS = [['breakfast', 'Sarapan'], ['lunch', 'Makan siang'], ['snack', 'Camilan'], ['dinner', 'Makan malam']];
const tgl = k => { const d = fromKey(k); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]}`; };
const pendek = k => `${HARI[fromKey(k).getDay()].slice(0, 3)} ${fromKey(k).getDate()}`;
function lalu(at) { if (!at) return '–'; const s = (Date.now() - at) / 1000; if (s < 60) return 'baru saja'; if (s < 3600) return Math.floor(s / 60) + ' menit lalu'; if (s < 86400) return Math.floor(s / 3600) + ' jam lalu'; const d = new Date(at); return `${d.getDate()} ${BULAN[d.getMonth()].slice(0, 3)}`; }

const S = {data: null, sel: null, err: ''};
const standalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
const CHAR = {name: 'Musubi', color: '#E0463C', pixel: true, art: null};

function shade(hex, f) { const n = parseInt(hex.slice(1), 16); return '#' + [16, 8, 0].map(s => Math.round(((n >> s) & 255) * f).toString(16).padStart(2, '0')).join(''); }
function spriteGrid(st, tier) {
  tier = tier || 1;
  const G = Array.from({length: 24}, () => Array(24).fill('.')), oy = 3;
  const put = (x, y, c) => { if (x >= 0 && x < 24 && y >= 0 && y < 24) G[y][x] = c; };
  const P = (x, y, c) => put(x, y + oy, c);
  const E = {2: [9, 14], 3: [8, 15], 4: [7, 16], 5: [7, 16], 6: [6, 17], 7: [6, 17], 8: [5, 18], 9: [5, 18], 10: [4, 19], 11: [4, 19], 12: [3, 20], 13: [3, 20], 14: [2, 21], 15: [2, 21], 16: [2, 21], 17: [2, 21], 18: [3, 20]};
  for (let x = 10; x <= 13; x++) P(x, 1, 'k');
  for (let x = 4; x <= 19; x++) P(x, 19, 'k');
  for (const ys in E) { const y = +ys, [l, r] = E[ys]; P(l, y, 'k'); P(r, y, 'k'); for (let x = l + 1; x < r; x++) P(x, y, 'w'); }
  for (let y = 12; y <= 18; y++) P(E[y][0] + 1, y, 's');
  for (let y = 14; y <= 17; y++) P(E[y][0] + 2, y, 's');
  [[12, 4], [17, 9], [18, 15]].forEach(([x, y]) => P(x, y, 's'));
  // sweatband in the theme colour
  for (let x = 6; x <= 17; x++) { P(x, 6, 'r'); P(x, 7, 'R'); }
  P(18, 6, 'r'); P(19, 5, 'r'); P(20, 5, 'R'); P(18, 7, 'R'); P(19, 8, 'r'); P(20, 8, 'R');
  // nori
  for (let y = 15; y <= 18; y++) for (let x = 8; x <= 15; x++) P(x, y, 'n');
  P(9, 15, 'N'); P(10, 15, 'N'); P(9, 16, 'N');
  // tier 2+: lifting belt with a gold buckle
  if (tier >= 2) {
    for (let x = 3; x <= 20; x++) { P(x, 15, 'b'); P(x, 16, 'B'); }
    [[10, 15], [11, 15], [12, 15], [13, 15], [10, 16], [13, 16]].forEach(([x, y]) => P(x, y, 'g'));
    P(11, 16, 'G'); P(12, 16, 'G');
  }
  // tier 4+: gold crown on top
  if (tier >= 4) {
    [8, 11, 12, 15].forEach(x => P(x, -2, 'g'));
    for (let x = 8; x <= 15; x++) { P(x, -1, 'g'); P(x, 0, 'G'); }
    P(10, 0, 'e'); P(13, 0, 'e');
  }
  // blush (gone when disappointed)
  if (st !== 'sad') { P(6, 11, 'p'); P(7, 11, 'p'); P(16, 11, 'p'); P(17, 11, 'p'); }
  const eyesOpen = () => { for (const ex of [8, 14]) { P(ex, 9, 'w'); P(ex + 1, 9, 'k'); P(ex, 10, 'k'); P(ex + 1, 10, 'k'); } };
  const eyesHappy = () => { [[7, 10], [8, 9], [9, 9], [10, 10], [13, 10], [14, 9], [15, 9], [16, 10]].forEach(([x, y]) => P(x, y, 'k')); };
  const eyesShut = () => { [8, 9, 14, 15].forEach(x => P(x, 10, 'k')); };
  const smile = () => { [[10, 12], [13, 12], [11, 13], [12, 13]].forEach(([x, y]) => P(x, y, 'k')); };
  const open = () => { [[10, 12], [13, 12], [10, 13], [13, 13], [11, 14], [12, 14]].forEach(([x, y]) => P(x, y, 'k')); [[11, 12], [12, 12], [11, 13], [12, 13]].forEach(([x, y]) => P(x, y, 'm')); };
  const oh = () => { [[11, 12], [12, 12], [11, 13], [12, 13]].forEach(([x, y]) => P(x, y, 'k')); };
  const flat = () => { P(11, 13, 'k'); P(12, 13, 'k'); };
  // disappointed: heavy lids with pupils peeking under, a frown and a sweat drop
  const eyesLidded = () => { for (const ex of [8, 14]) { P(ex - 1, 9, 'k'); P(ex, 9, 'k'); P(ex + 1, 9, 'k'); P(ex, 10, 'k'); P(ex + 1, 10, 'k'); } };
  const frown = () => { [[11, 12], [12, 12], [10, 13], [13, 13]].forEach(([x, y]) => P(x, y, 'k')); };
  const sweat = () => { P(18, 8, 'e'); P(17, 9, 'e'); P(18, 9, 'e'); P(17, 10, 'e'); P(18, 10, 'E'); };
  if (st === 'sad') { eyesLidded(); frown(); sweat(); }
  else if (st === 'cheer') { eyesHappy(); open(); }
  else if (st === 'flex') { eyesHappy(); smile(); }
  else if (st === 'wave') { eyesOpen(); oh(); }
  else if (st === 'sleep') { eyesShut(); flat(); }
  else { eyesOpen(); smile(); }
  const arms = [], A = (x, y) => arms.push([x, y + oy]);
  if (st === 'cheer') { A(3, 10); A(2, 9); A(1, 8); A(1, 7); A(20, 10); A(21, 9); A(22, 8); A(22, 7); }
  else if (st === 'flex') { A(1, 14); A(0, 13); A(0, 12); A(1, 11); A(22, 14); A(23, 13); A(23, 12); A(22, 11); }
  else if (st === 'wave') { A(1, 14); A(1, 15); A(20, 10); A(21, 9); A(22, 8); A(22, 7); }
  else if (st === 'sad') { A(1, 16); A(1, 17); A(22, 16); A(22, 17); }
  else { A(1, 14); A(1, 15); A(22, 14); A(22, 15); }
  for (const [x, y] of arms) put(x, y, 'w');
  for (const [x, y] of arms) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (nx >= 0 && nx < 24 && ny >= 0 && ny < 24 && G[ny][nx] === '.') G[ny][nx] = 'k'; }
  // tier 3+: hero cape behind the body, filling only empty pixels
  if (tier >= 3) {
    const fill = (x, y, c) => { const gy = y + oy; if (x >= 0 && x < 24 && gy >= 0 && gy < 24 && G[gy][x] === '.') G[gy][x] = c; };
    for (let y = 7; y <= 19; y++) {
      const l = y === 19 ? 4 : E[y][0], r = y === 19 ? 19 : E[y][1], w = y < 11 ? 1 : 2;
      for (let i = 1; i <= w; i++) { const c = i === w ? 'C' : 'c'; fill(l - i, y, c); fill(r + i, y, c); }

    for (let x = 1; x <= 22; x++) fill(x, 20, 'C');

  if (tier >= 5) {
    const glow = [];
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) if (G[y][x] === '.' && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const v = (G[y + dy] || [])[x + dx]; return v && v !== '.' && v !== 'a'; })) glow.push([x, y]);

  if (st === 'sleep') { [[17, 0], [18, 0], [19, 0], [18, 1], [17, 2], [18, 2], [19, 2], [21, 2], [22, 2], [22, 3], [21, 4], [22, 4]].forEach(([x, y]) => put(x, y, 'z')); }
  if (st === 'sad') {
    // little rain cloud
    [[18, 0], [19, 0], [17, 1], [18, 1], [19, 1], [20, 1], [21, 1], [16, 2], [17, 2], [18, 2], [19, 2], [20, 2], [21, 2], [22, 2]].forEach(([x, y]) => put(x, y, 'z'));
    [[17, 4], [19, 5], [21, 4]].forEach(([x, y]) => { if (G[y][x] === '.') put(x, y, 'e'); });
  }
  return G;
}


function spriteSVG(st, size, tier) {
  const G = spriteGrid(st, tier), pal = {k: '#1C1E22', w: '#FCFCF6', s: '#DEDED1', n: '#21402F', N: '#3B6852', r: CHAR.color, R: shade(CHAR.color, 0.72), p: '#F2A09A', m: '#9B3A30', y: '#F0C030', z: '#9AA1A7',
    b: '#6B4426', B: '#4A2E19', g: '#F0C030', G: '#B8860B', e: '#5CC8F0', E: '#2E8FC0', c: '#5B3A99', C: '#3D2570', a: '#FFD54A'};
  const by = {};
  for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) { const c = G[y][x]; if (c !== '.') (by[c] = by[c] || []).push(`M${x} ${y}h1v1h-1z`); }
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" shape-rendering="crispEdges" aria-hidden="true">${Object.keys(by).map(c => `<path fill="${pal[c]}"${c === 'a' ? ' class="aura" fill-opacity=".6"' : ''} d="${by[c].join('')}"/>`).join('')}</svg>`;
}
function charHTML(st, tier) {
  if (CHAR.art && /^data:image\/(png|jpeg|webp|gif);base64,/.test(CHAR.art)) return `<img src="${esc(CHAR.art)}" alt="" width="92" height="92" class="${CHAR.pixel ? 'pix' : ''}">`;
  return spriteSVG(st, 92, tier);
}

function sonToday(sm) {
  if (sm && sm.tz) { try { const v = new Date().toLocaleDateString('en-CA', {timeZone: sm.tz}); if (/^\d{4}-\d\d-\d\d$/.test(v)) return v; } catch (e) {} }
  return (sm && sm.today) || keyOf(new Date());
}
function mood(d, sm, isToday) {
  const nm = sm.name || 'Anak Ibu';
  if (!d || !(d.kcal > 0)) return {st: isToday ? 'wave' : 'idle', t: isToday ? `Halo, Bu! ${nm} belum mencatat makanan hari ini.` : `Hari itu ${nm} tidak mencatat makanan.`};
  const over = d.kcal - d.target, night = (d.meals || []).filter(m => m.nt);
  if (over > d.target * 0.05) return {st: 'sad', t: `Waduh, Bu… ${nm} kelebihan ${fmt(over)} kkal${isToday ? ' hari ini' : ''}. Besok kita bangkit lagi.`};
  if (night.length) return {st: 'sleep', t: `${nm} makan malam-malam (${fmt(night.reduce((a, m) => a + m.kcal, 0))} kkal). Kirimi dia semangat, Bu?`};
  if (d.resisted) return {st: 'flex', t: `${nm} berhasil menahan godaan ngemil malam ${d.resisted}×. Hebat!`};
  if (d.p >= d.pT * 0.95) return {st: 'flex', t: `Protein ${nm} sudah tercapai. Mantap, Bu!`};
  return {st: 'cheer', t: `Aman, Bu! ${nm} sudah makan ${fmt(d.kcal)} kkal, masih sisa ${fmt(Math.max(0, d.target - d.kcal))} kkal.`};
}

function render() {
  const app = $('#app');
  if (S.err) { app.innerHTML = `<header><div class="eyebrow">Iron &amp; Rice</div><h1>Pantau</h1></header><section class="card"><p>${esc(S.err)}</p></section>`; return; }
  if (!S.data) return;
  const {sum: sm, days: D, synced} = S.data, nm = esc(sm.name || 'Anak Ibu'), tier = Number(sm.tier) || 1;
  document.title = `Pantau ${sm.name || 'Musubi'}`;
  document.documentElement.style.setProperty('--char', CHAR.color);
  const head = sub => `<header><div class="eyebrow">${sub}</div><h1>Pantau ${nm}</h1></header>`;
  if (sm.off) { app.innerHTML = head('Iron &amp; Rice') + `<section class="coach"><div class="char s-sleep">${charHTML('sleep', tier)}</div><div class="bubble"><b>${esc(CHAR.name)}</b><p>${nm} sedang tidak membagikan datanya. Nanti dicek lagi ya, Bu.</p></div></section>`; return; }
  const today = sonToday(sm), days = Array.from({length: 7}, (_, i) => addDays(today, -i));
  const sel = days.includes(S.sel) ? S.sel : today, d = D[sel], isToday = sel === today, md = mood(d, sm, isToday);
  const pct = v => clamp(v * 100, 0, 100).toFixed(1);
  const last = Number(sm.at) || synced, stale = Date.now() - (synced || 0) > 3 * 3600e3;
  const strip = days.map(k => {
    const x = D[k], c = !x || !(x.kcal > 0) ? '--line' : x.kcal > x.target * 1.05 ? '--protein' : '--ok';
    const lab = k === today ? 'Hari ini' : k === addDays(today, -1) ? 'Kemarin' : pendek(k);
    return `<button class="chip" style="--c:var(${c})" aria-pressed="${k === sel}" data-day="${k}"><i></i>${lab}</button>`;
  }).join('');
  let board, food = '';
  if (d && d.kcal > 0) {
    const left = d.target - d.kcal;
    board = `<section class="board" aria-label="Kalori">
      <div class="board-top"><span class="eyebrow">Kalori${isToday ? ' hari ini' : ''}</span><span class="eyebrow">Target ${fmt(d.target)} kkal</span></div>
      <div class="bignum ${left < 0 ? 'over' : ''}"><span class="n">${fmt(Math.abs(left))}</span><span class="u">${left < 0 ? 'kkal lebih' : 'kkal sisa'}</span></div>
      <div class="stack" role="img" aria-label="${fmt(d.kcal)} dari ${fmt(d.target)} kkal"><i style="width:${pct(d.kcal / d.target)}%;background:var(${left < 0 ? '--bp' : '--bo'})"></i></div>
      <div class="legend"><span>${fmt(d.kcal)} dimakan</span><span>${fmt(d.target)}</span></div>
      <div class="mrow"><span class="ml">Protein</span><div class="mbar"><i style="width:${pct(d.p / d.pT)}%"></i></div><span class="mv"><b>${fmt(d.p)}</b> / ${fmt(d.pT)} g</span></div>
    </section>`;
    const meals = d.meals || [], groups = SLOTS.map(([id, l]) => [l, meals.filter(m => m.m === id)]).filter(g => g[1].length);
    if (groups.length) food = `<section class="card"><div class="card-h"><h2>Makanan</h2><span class="side">${meals.length} catatan</span></div>
      ${groups.map(([l, ms]) => `<div><h3 class="slot">${l}<span>${fmt(ms.reduce((a, m) => a + m.kcal, 0))} kkal</span></h3>
        <ul class="entries">${ms.map(m => `<li><span class="en">${esc(m.n)}<small>${esc(m.s || '')}${m.q ? ' · ×' + esc(m.q) : ''}${m.t ? ' · ' + esc(String(m.t).replace(':', '.')) : ''}${m.nt ? ' <span class="ntag">Malam</span>' : ''}</small></span><span class="ek">${fmt(m.kcal)}</span></li>`).join('')}</ul></div>`).join('')}
      <p class="note">Jam sesuai waktu di tempat ${nm}.</p></section>`;
  } else {
    board = `<section class="card"><div class="empty">${isToday ? 'Belum ada makanan yang dicatat hari ini.' : 'Tidak ada catatan untuk hari ini.'}</div></section>`;
  }
  const nightItems = d && d.meals ? d.meals.filter(m => m.nt) : [];
  const night = `<section class="card night"><div class="card-h"><h2>Godaan malam</h2><span class="side">Total ${fmt(sm.resistedTotal || 0)}× ditahan</span></div>
    <div class="stats"><div class="stat"><b>${d ? (d.resisted || 0) : 0}×</b><span>ditahan</span></div><div class="stat"><b>${nightItems.length}</b><span>camilan malam</span></div><div class="stat"><b>${fmt(nightItems.reduce((a, m) => a + m.kcal, 0))}</b><span>kkal malam</span></div></div>
    <p class="note">${sm.guardOn ? `Penjaga malam ${nm} aktif mulai pukul ${esc(sm.guardFrom)}.00. Kalau ingin ngemil, aplikasinya minta dia menunggu 10 menit dulu.` : 'Penjaga malam sedang dimatikan.'}</p></section>`;
  const lost = Math.max(0, sm.startKg - sm.cur), total = Math.max(0.1, sm.startKg - sm.goalKg), prog = clamp(lost / total, 0, 1);
  const ws = (Array.isArray(sm.weighs) ? sm.weighs : []).slice(-5).reverse();
  const weight = `<section class="card"><div class="card-h"><h2>Berat badan</h2><span class="side">Target ${g1(sm.goalKg)} kg</span></div>
    <div class="wbig"><b>${g1(sm.cur)}</b><span>kg</span><span style="margin-left:auto">turun ${g1(lost)} kg</span></div>
    <div class="wbar" role="img" aria-label="${Math.round(prog * 100)}% menuju target"><i style="width:${(prog * 100).toFixed(1)}%"></i></div>
    <p class="note">Mulai dari ${g1(sm.startKg)} kg · sisa ${g1(Math.max(0, sm.cur - sm.goalKg))} kg lagi.</p>
    ${ws.length ? `<table><thead><tr><th>Timbang</th><th>Berat</th></tr></thead><tbody>${ws.map(w => `<tr><td>${esc(tgl(w.k))}</td><td>${g1(w.v)} kg</td></tr>`).join('')}</tbody></table>` : ''}
    <p class="note">Berat harian bisa naik-turun sekitar 1 kg karena air dan garam. Lihat arahnya dalam beberapa minggu.</p></section>`;
  const week = `<section class="card"><div class="card-h"><h2>7 hari terakhir</h2></div><div style="overflow-x:auto"><table><thead><tr><th>Hari</th><th>Kalori</th><th>Status</th></tr></thead><tbody>
    ${days.map(k => { const x = D[k], has = x && x.kcal > 0, ov = has ? x.kcal - x.target : 0;
      const st = !has ? ['--line', 'Tidak dicatat'] : ov > x.target * 0.05 ? ['--protein', `Lebih ${fmt(ov)}`] : ['--ok', 'Pas'];
      return `<tr><td>${k === today ? 'Hari ini' : esc(pendek(k))}</td><td>${has ? `${fmt(x.kcal)} / ${fmt(x.target)}` : '–'}</td><td><span class="dotc" style="--c:var(${st[0]})"></span>${st[1]}</td></tr>`; }).join('')}
    </tbody></table></div></section>`;
  app.innerHTML = head(esc(tgl(sel))) +
    `<span class="live ${stale ? 'stale' : ''}"><i></i>Catatan terakhir ${esc(lalu(last))}</span>
    <div class="daystrip" role="group" aria-label="Pilih hari">${strip}</div>
    <section class="coach"><div class="char s-${md.st}">${charHTML(md.st, tier)}</div><div class="bubble"><b>${esc(CHAR.name)}</b><p>${esc(md.t)}</p></div></section>
    ${board}${food}${night}${weight}${week}
    ${standalone() ? '' : `<section class="card"><h3>Simpan ke layar utama</h3><p class="note">Supaya gampang dibuka lagi: di iPhone, tekan tombol Bagikan lalu <b>Tambah ke Layar Utama</b>. Di Android, tekan ⋮ lalu <b>Tambahkan ke layar utama</b>. Nanti muncul ikon Musubi.</p></section>`}
    <p class="note" style="text-align:center">Halaman ini diperbarui sendiri kira-kira setiap jam. Tidak perlu dimuat ulang.</p>`;
}

/* load + decrypt */
const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
let cryptoKey = null, lastCt = '';
// The key arrives once in the link (after #). It is saved in this browser and removed from the address bar,
// so the short address and a home-screen icon keep working without the long link.
const KEY_LS = 'musubi-key';
function getKey() {
  const fromHash = location.hash.slice(1).replace(/^k=/, '');
  if (fromHash) {
    try { localStorage.setItem(KEY_LS, fromHash); history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    return fromHash;
  }
  try { return localStorage.getItem(KEY_LS) || ''; } catch (e) { return ''; }
}
const theKey = getKey();
async function load() {
  const k = theKey;
  if (!k) { S.err = 'Buka tautan lengkap dari anak Ibu sekali saja. Setelah itu halaman ini akan ingat sendiri.'; render(); return; }
  try {
    if (!cryptoKey) cryptoKey = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', false, ['decrypt']);
    const res = await fetch('data.json?t=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error('fetch');
    const box = await res.json();
    if (box.ct === lastCt) return;
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(box.iv)}, cryptoKey, b64(box.ct));
    const data = JSON.parse(new TextDecoder().decode(plain));
    if (!data || !data.sum) throw new Error('shape');
    lastCt = box.ct; S.err = '';
    if (data.char) Object.assign(CHAR, {name: String(data.char.name || 'Musubi').slice(0, 24), color: /^#[0-9a-f]{6}$/i.test(data.char.color) ? data.char.color : '#E0463C', pixel: data.char.pixel !== false, art: data.char.art || null});
    S.data = {sum: data.sum, days: data.days || {}, synced: Number(data.synced) || 0};
    render();
  } catch (e) {
    if (!S.data) { S.err = e && e.name === 'OperationError' ? 'Tautan ini sudah tidak berlaku. Minta tautan baru ke anak Ibu.' : 'Belum bisa memuat data. Coba lagi sebentar.'; render(); }
  }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (b) { S.sel = b.dataset.day; render(); } });
load();
setInterval(load, 5 * 60 * 1000);
setInterval(() => { if (S.data) render(); }, 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
